name: Deploy (disabled)

# This workflow published a static export to GitHub Pages. The app is no longer
# a static export: auth needs a server and a database, so `next build` produces
# a Node app that Pages cannot serve. See
# docs/decisions/0002-auth-needs-a-server.md.
#
# The push trigger is removed rather than the workflow deleted, so that the
# working Pages setup is still here to adapt once a host is chosen. Running it
# by hand will fail until then.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; never cancel one halfway through.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build static export
        # A project site is served from /<repo>, so the app needs a basePath.
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build

      - name: Disable Jekyll processing
        run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
